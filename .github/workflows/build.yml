name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Sanitize + validate XML resources
        run: |
          set -e
          python3 - <<'PY'
          import glob, xml.dom.minidom
          bad = 0
          for f in glob.glob("app/src/main/**/*.xml", recursive=True):
              b = open(f, "rb").read()
              clean = b.decode("utf-8-sig", errors="replace").replace("\r\n", "\n").replace("\ufeff", "").replace("\u200b", "").lstrip()
              if clean.encode() != b:
                  print("FIXED:", f, "head bytes:", b[:12])
                  open(f, "wb").write(clean.encode())
              try:
                  xml.dom.minidom.parse(f)
              except Exception as e:
                  bad = 1
                  print("BAD XML:", f, e)
          raise SystemExit(bad)
          PY

      - name: Build debug + release APK
        run: gradle --no-daemon --stacktrace assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: DashX-apk
          path: app/build/outputs/apk/**/*.apk

      - name: Publish GitHub Release (only on v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
